# Project-local LuaLS settings for this Kristal mod.
# The mod remains its own workspace; Kristal is provided directly from engine source.

[language-server.lua-language-server]
command = "lua-language-server"

[language-server.lua-language-server.config.Lua.runtime]
version = "LuaJIT"

[language-server.lua-language-server.config.Lua.runtime.builtin]
utf8 = "enable"

[language-server.lua-language-server.config.Lua.runtime.special]
"love.filesystem.load" = "loadfile"
modRequire = "require"
libRequire = "require"

[language-server.lua-language-server.config.Lua.workspace]
library = [
  "${3rd}/love2d/library",
  ".helix/kristal-mod-globals.lua",
  "${env:KRISTAL_ROOT}/main.lua",
  "${env:KRISTAL_ROOT}/src",
  "~/Projects/LuaProjects/Kristal/main.lua",
  "~/Projects/LuaProjects/Kristal/src",
]
checkThirdParty = "Disable"

[language-server.lua-language-server.config.Lua.completion]
autoRequire = false

[language-server.lua-language-server.config.Lua.diagnostics]
workspaceEvent = "OnChange"
globals = ["love"]
disable = [
  "duplicate-set-field",
  "redundant-parameter",
  "undefined-doc-name",
  "return-type-mismatch",
  "lowercase-global",
  "need-check-nil",
  "cast-local-type",
  "inject-field",
  "undefined-field",
]

[language-server.lua-language-server.config.Lua.type]
weakNilCheck = true
weakUnionCheck = true

[language-server.lua-language-server.config.Lua.format.defaultConfig]
indent_style = "space"
indent_size = "4"

[[language]]
name = "lua"
language-servers = ["lua-language-server"]
indent = { tab-width = 4, unit = "    " }
